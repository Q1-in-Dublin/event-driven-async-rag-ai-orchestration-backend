services:
    api:
        build: .
        ports:
            - '8000:8000'
        env_file:
            - .env

        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_started

        volumes:
            - ./app:/app/app
            - ./tests:/app/tests
            - ./seed_documents.py:/app/seed_documents.py
            - ./docs:/app/docs

    redis:
        image: redis:7-alpine
        ports:
            - '6379:6379'

    postgres:
        image: pgvector/pgvector:pg16
        environment:
            POSTGRES_USER: raguser
            POSTGRES_PASSWORD: ragpass
            POSTGRES_DB: ragdb
        ports:
            - '5432:5432'
        volumes:
            - pgdata:/var/lib/postgresql/data
            - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U raguser -d ragdb']
            interval: 2s
            timeout: 3s
            retries: 10

volumes:
    pgdata:
